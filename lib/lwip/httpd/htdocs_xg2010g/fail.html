<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>XG2010G 上传失败</title>
<style>
:root{
  color-scheme:light;
  --bg:#f2f4f8;
  --panel:#ffffff;
  --line:#d6dde7;
  --ink:#1d2733;
  --muted:#6b7788;
  --blue:#2878e3;
  --blue-dark:#1762c2;
  --red:#b34338;
  --red-soft:#fbecea;
}
*{box-sizing:border-box}
body{
  min-height:100svh;
  margin:0;
  display:grid;
  place-items:center;
  padding:20px;
  color:var(--ink);
  background:var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,sans-serif;
}
.panel{
  width:min(560px,100%);
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel);
  box-shadow:0 12px 34px rgba(45,64,89,.10);
}
.head{
  display:flex;
  align-items:center;
  gap:14px;
  padding:22px 24px;
  border-bottom:1px solid #edcbc7;
  background:var(--red-soft);
}
.mark{
  width:36px;
  height:36px;
  flex:0 0 36px;
  display:grid;
  place-items:center;
  border-radius:7px;
  color:#ffffff;
  background:var(--red);
  font-size:19px;
  font-weight:800;
}
h1{margin:0;font-size:20px}
.head p{margin:4px 0 0;color:var(--red);font-size:12px;font-weight:650}
.content{padding:24px}
.content>p{margin:0;color:var(--muted);line-height:1.7}
ul{margin:18px 0 22px;padding-left:19px;color:#566273;font-size:13px;line-height:1.9}
a{
  min-height:42px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 16px;
  border:1px solid var(--blue-dark);
  border-radius:7px;
  color:#ffffff;
  background:var(--blue);
  text-decoration:none;
  font-weight:720;
}
a:hover{background:var(--blue-dark)}
</style>
</head>
<body>
  <main class='panel'>
    <header class='head'>
      <div class='mark'>!</div>
      <div><h1>上传失败</h1><p>未开始擦除或写入操作</p></div>
    </header>
    <section class='content'>
      <p>恢复服务器无法接受此镜像。请检查目标和文件后重试。</p>
      <ul>
        <li>固件镜像大小至少为 1 MiB。</li>
        <li>U-Boot 镜像不能超过 2 MiB。</li>
        <li>同一时间只能运行一个恢复任务。</li>
      </ul>
      <a href='/index.html'>返回恢复页面</a>
    </section>
  </main>
</body>
</html>
